# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time

name: Cross-Platform Deployment

env:
  APP_VERSION: "1.7.0.0"
  APP_VERSION_SHORT: "1.7.0"

on:
  push:
    branches: [ "main", "production" ]
  pull_request:
    branches: [ "main", "production" ]

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      matrix:
        java: [ '21.0.1' ]
      fail-fast: false
    name: 'windows-latest'
    steps:
      - name: Git checkout
        uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
      - name: Echo JAVA_HOME
        run: echo $JAVA_HOME
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Download Inno Setup installer
        run: Invoke-WebRequest -Uri https://github.com/jrsoftware/issrc/releases/download/is-6_4_2/innosetup-6.4.2.exe -OutFile inno-setup.exe
      - name: Install Inno Setup
        run: .\inno-setup.exe /SILENT
      - name: Add Inno Setup to PATH
        run: echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build and package with Gradle
        run: .\gradlew --info --stacktrace localWinDeploy
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: MORTAR_v${{ env.APP_VERSION }}_WINx64_setup.exe
          path: build\winDeploy\out\*.exe
          retention-days: 30
          compression-level: 0 # no compression since it makes no difference

  build-macos:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ macos-15-intel , macos-15 ] #the latter one is Arm64 architecture
        java: [ '21.0.1' ]
      fail-fast: false
    name: ${{ matrix.os }}
    steps:
      - name: Git checkout
        uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
      - name: Echo JAVA_HOME
        run: echo $JAVA_HOME
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Package DMG (ARM)
        if: matrix.os == 'macos-15'
        run: ./gradlew --info --stacktrace localMacDmgArm
      - name: Package DMG (Intel)
        if: matrix.os == 'macos-15-intel'
        run: ./gradlew --info --stacktrace localMacDmgIntel
      # Uploaded before the smoke test, so that a DMG that fails it is still available for debugging
      - name: Upload DMG as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os == 'macos-15' && format('MORTAR-aarch64-{0}.dmg', env.APP_VERSION_SHORT) || format('MORTAR-{0}.dmg', env.APP_VERSION_SHORT) }}
          path: build/jpackage/out/*.dmg
          retention-days: 30
          compression-level: 0 # no compression since it makes no difference
      # Starts the app from the DMG: it must still run after 30 s and pass the log checks in
      # .github/scripts/check-smoke-test-logs.sh (same checks as for the DEB, see the build-linux job). Each runner tests
      # the DMG of its own architecture, so this also covers the JavaFX jars of that architecture. macOS runners have a
      # GUI session, so no virtual display is needed. macOS has no "timeout" command, so the app is started in the
      # background and stopped after 30 s.
      - name: Smoke-test the DMG
        run: |
          tmpMountDir="$RUNNER_TEMP/dmg"
          hdiutil attach -nobrowse -readonly -mountpoint "$tmpMountDir" build/jpackage/out/*.dmg
          tmpPid=""
          # stops the app and detaches the DMG on every way out of this step, including the early exits below
          # (every command ends in "|| true": under "bash -e", a failing command, e.g. kill on an app that has already
          # exited, would otherwise make the trap fail a passed step)
          trap 'if [ -n "$tmpPid" ]; then kill -9 "$tmpPid" 2> /dev/null || true; fi; hdiutil detach -force "$tmpMountDir" > /dev/null 2>&1 || true' EXIT
          # MORTAR logs to the console only until its logging is set up, then only to files in this folder. On macOS,
          # FileUtil.getAppDirPath() puts the app data under Library/Application Support in the user home (+
          # mortar.vendor.name/mortar.dataDirectory.name/mortar.logDirectory.name). It is emptied first so that only
          # the log of this run is checked.
          tmpLogDir="$HOME/Library/Application Support/MORTAR/MORTAR_Data/Logs"
          rm -rf "$tmpLogDir"
          "$tmpMountDir/MORTAR.app/Contents/MacOS/MORTAR" > "$RUNNER_TEMP/smoke.log" 2>&1 &
          tmpPid=$!
          sleep 30
          if ! kill -0 "$tmpPid" 2> /dev/null; then
            set +e
            wait "$tmpPid"
            tmpExit=$?
            set -e
            cat "$RUNNER_TEMP/smoke.log"
            echo "::error::MORTAR exited with code $tmpExit within 30 s"
            exit 1
          fi
          kill "$tmpPid" 2> /dev/null || true
          # waits up to 10 s for the app to exit after SIGTERM; the trap kills it if it is still running
          for tmpSecond in $(seq 10); do
            kill -0 "$tmpPid" 2> /dev/null || break
            sleep 1
          done
          cat "$RUNNER_TEMP/smoke.log"
          bash .github/scripts/check-smoke-test-logs.sh "$RUNNER_TEMP/smoke.log" "$tmpLogDir"

  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java: [ '21.0.1' ]
    name: 'ubuntu-latest'
    steps:
      - name: Git checkout
        uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
      - name: Echo JAVA_HOME
        run: echo $JAVA_HOME
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build DEB with Gradle
        run: ./gradlew --info --stacktrace localLinuxDeb
      - name: Upload DEB as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: MORTAR-${{ env.APP_VERSION_SHORT }}.deb
          path: build/jpackage/out/*.deb
          retention-days: 30
          compression-level: 0 # no compression since it makes no difference
      - name: Build RPM with Gradle
        run: ./gradlew --info --stacktrace localLinuxRpm
      - name: Upload RPM as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: MORTAR-${{ env.APP_VERSION_SHORT }}.rpm
          path: build/jpackage/out/*.rpm
          retention-days: 30
          compression-level: 0 # no compression since it makes no difference
      # Starts the packaged app on a virtual display: it must still run after 30 s and pass the log checks in
      # .github/scripts/check-smoke-test-logs.sh: no uncaught exception, no SEVERE error, and a completed startup.
      # This catches packages that build fine but cannot start (e.g., a broken class path) as well as errors during
      # startup that MORTAR catches itself: MainApp.start() logs those as SEVERE and shows them in a modal dialog that
      # blocks until the timeout, so the app looks like it is still running.
      # It runs after building and uploading both packages, so that a failing smoke test neither prevents the RPM
      # build nor withholds the DEB needed to debug it.
      - name: Smoke-test the DEB
        run: |
          # xvfb is preinstalled on the ubuntu-latest runners; separate commands so that a failing apt-get stops the step
          if ! command -v xvfb-run > /dev/null; then
            sudo apt-get update -q
            sudo apt-get install -y -q xvfb
          fi
          dpkg-deb -x build/jpackage/out/*.deb "$RUNNER_TEMP/deb"
          # MORTAR logs to the console only until its logging is set up, then only to files in this folder. On Linux,
          # FileUtil.getAppDirPath() puts the app data directly in the user home (+
          # mortar.vendor.name/mortar.dataDirectory.name/mortar.logDirectory.name). It is emptied first so that only
          # the log of this run is checked.
          tmpLogDir="$HOME/MORTAR/MORTAR_Data/Logs"
          rm -rf "$tmpLogDir"
          set +e
          timeout --kill-after=10 30 xvfb-run -a "$RUNNER_TEMP/deb/opt/mortar/bin/MORTAR" 2>&1 | tee "$RUNNER_TEMP/smoke.log"
          tmpExit=${PIPESTATUS[0]}
          set -e
          # 124: still running after 30 s and stopped by SIGTERM; 137: still running and killed 10 s later because it
          # did not exit on SIGTERM in time. Both mean that the app was running for the full 30 s.
          if [ "$tmpExit" -ne 124 ] && [ "$tmpExit" -ne 137 ]; then echo "::error::MORTAR exited with code $tmpExit within 30 s"; exit 1; fi
          bash .github/scripts/check-smoke-test-logs.sh "$RUNNER_TEMP/smoke.log" "$tmpLogDir"

  build-fat-jars:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java: [ '21.0.1' ]
    name: 'fat-jars'
    steps:
      - name: Git checkout
        uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
      - name: Echo JAVA_HOME
        run: echo $JAVA_HOME
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build fatJar with Gradle
        run: ./gradlew --info --stacktrace fatJar
      - name: Upload JAR as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: MORTAR-fat-${{ env.APP_VERSION }}.jar
          path: ./build/libs/MORTAR-fat-${{ env.APP_VERSION }}.jar
          retention-days: 30
          compression-level: 0 # no compression since it makes no difference
      - name: Build fatJarAarch64 with Gradle
        run: ./gradlew --info --stacktrace fatJarAarch64
      - name: Upload Aarch64 JAR as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: MORTAR-fat-aarch64-${{ env.APP_VERSION }}.jar
          path: ./build/libs/MORTAR-fat-aarch64-${{ env.APP_VERSION }}.jar
          retention-days: 30
          compression-level: 0 # no compression since it makes no difference
