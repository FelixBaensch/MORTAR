# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time

name: Cross-Platform Deployment

env:
  APP_VERSION: "1.6.0.0"
  APP_VERSION_SHORT: "1.6.0"

on:
  push:
    branches: [ "main", "production" ]
  pull_request:
    branches: [ "main", "production" ]

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      matrix:
        java: [ '21.0.1' ]
      fail-fast: false
    name: 'windows-latest'
    steps:
      - name: Git checkout
        uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
      - name: Echo JAVA_HOME
        run: echo $JAVA_HOME
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Run tests
        run: .\gradlew test
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-test-report
          path: build/reports/tests/test
          retention-days: 30
      - name: Download Inno Setup installer
        run: Invoke-WebRequest -Uri https://github.com/jrsoftware/issrc/releases/download/is-6_4_2/innosetup-6.4.2.exe -OutFile inno-setup.exe
      - name: Install Inno Setup
        run: .\inno-setup.exe /SILENT
      - name: Add Inno Setup to PATH
        run: echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build and package with Gradle
        run: .\gradlew --info --stacktrace localWinDeploy
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: MORTAR_v${{ env.APP_VERSION }}_WINx64_setup.exe
          path: build\winDeploy\out\*.exe
          retention-days: 30
          compression-level: 0 # no compression since it makes no difference

  build-macos:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ macos-15-intel , macos-15 ] #the latter one is Arm64 architecture
        java: [ '21.0.1' ]
      fail-fast: false
    name: ${{ matrix.os }}
    steps:
      - name: Git checkout
        uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
      - name: Echo JAVA_HOME
        run: echo $JAVA_HOME
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      # Run the suite on one macOS architecture only: this is a platform smoke test (headless JavaFX, file
      # handling, path semantics), not an architecture-specific one, and macOS runner minutes are expensive.
      - name: Run tests
        if: matrix.os == 'macos-15'
        run: ./gradlew test
      - name: Upload test report
        if: failure() && matrix.os == 'macos-15'
        uses: actions/upload-artifact@v7
        with:
          name: macos-test-report
          path: build/reports/tests/test
          retention-days: 30
      - name: Package DMG (ARM)
        if: matrix.os == 'macos-15'
        run: ./gradlew --info --stacktrace localMacDmgArm
      - name: Package DMG (Intel)
        if: matrix.os == 'macos-15-intel'
        run: ./gradlew --info --stacktrace localMacDmgIntel
      - name: Upload DMG as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os == 'macos-15' && format('MORTAR-aarch64-{0}.dmg', env.APP_VERSION_SHORT) || format('MORTAR-{0}.dmg', env.APP_VERSION_SHORT) }}
          path: ./*.dmg
          retention-days: 30
          compression-level: 0 # no compression since it makes no difference

  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java: [ '21.0.1' ]
    name: 'ubuntu-latest'
    steps:
      - name: Git checkout
        uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
      - name: Echo JAVA_HOME
        run: echo $JAVA_HOME
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build DEB with Gradle
        run: ./gradlew --info --stacktrace localLinuxDeb
      - name: Upload DEB as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: MORTAR-${{ env.APP_VERSION_SHORT }}.deb
          path: ./*.deb
          retention-days: 30
          compression-level: 0 # no compression since it makes no difference
      - name: Build RPM with Gradle
        run: ./gradlew --info --stacktrace localLinuxRpm
      - name: Upload RPM as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: MORTAR-${{ env.APP_VERSION_SHORT }}.rpm
          path: ./*.rpm
          retention-days: 30
          compression-level: 0 # no compression since it makes no difference

  build-fat-jars:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        java: [ '21.0.1' ]
    name: 'fat-jars'
    steps:
      - name: Git checkout
        uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
      - name: Echo JAVA_HOME
        run: echo $JAVA_HOME
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build fatJar with Gradle
        run: ./gradlew --info --stacktrace fatJar
      - name: Upload JAR as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: MORTAR-fat-${{ env.APP_VERSION }}.jar
          path: ./build/libs/MORTAR-fat-${{ env.APP_VERSION }}.jar
          retention-days: 30
          compression-level: 0 # no compression since it makes no difference
      - name: Build fatJarAarch64 with Gradle
        run: ./gradlew --info --stacktrace fatJarAarch64
      - name: Upload Aarch64 JAR as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: MORTAR-fat-aarch64-${{ env.APP_VERSION }}.jar
          path: ./build/libs/MORTAR-fat-aarch64-${{ env.APP_VERSION }}.jar
          retention-days: 30
          compression-level: 0 # no compression since it makes no difference
