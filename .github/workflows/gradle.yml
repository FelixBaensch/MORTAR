# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ "main", "production" ]
  pull_request:
    branches: [ "main", "production" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Change wrapper permissions
      run: chmod +x ./gradlew
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6
    - name: Build with Gradle
      # The JaCoCo coverage gate is not part of `check`/`build` (it is unreachable on Windows, where a few
      # platform-specific tests are skipped), so it is requested explicitly here on the one platform that runs
      # the full suite.
      run: ./gradlew build jacocoTestCoverageVerification
